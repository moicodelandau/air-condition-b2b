<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <title>Quyết Nhanh · Decision Autopilot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name" data-i18n="appName">Quyết Nhanh</span>
    </div>
    <button id="langToggle" class="lang-toggle" title="Switch language">EN</button>
  </header>

  <section id="statsStrip" class="stats-strip"></section>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="decide"><span class="tab-icon">🎯</span><span class="tab-label" data-i18n="tabDecide">Quyết định</span></button>
    <button class="tab" data-tab="start"><span class="tab-icon">🚀</span><span class="tab-label" data-i18n="tabStart">Bắt đầu</span></button>
    <button class="tab" data-tab="rules"><span class="tab-icon">📜</span><span class="tab-label" data-i18n="tabRules">Luật</span></button>
    <button class="tab" data-tab="journal"><span class="tab-icon">📓</span><span class="tab-label" data-i18n="tabJournal">Nhật ký</span></button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
