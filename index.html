<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>AC Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --card2: #1a2438;
    --text: #e8eefc;
    --muted: #8fa0bf;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; gap: 8px;
    background: rgba(11,18,32,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #22304a;
  }
  header h1 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); flex: none; }
  header h1 .dot.online { background: var(--ok); }
  header .actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--card2); color: var(--text);
    border: 1px solid #2a3a58; border-radius: 10px;
    padding: 8px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card {
    background: var(--card); border: 1px solid #22304a;
    border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  /* Scanner */
  #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; min-height: 60px; }
  #reader video { border-radius: 10px; }
  .scan-btn {
    width: 100%; padding: 16px; margin-top: 10px;
    font-size: 17px; font-weight: 700;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #06222f; border: none; border-radius: var(--radius); cursor: pointer;
  }
  .scan-btn.stop { background: var(--card2); color: var(--err); border: 1px solid var(--err); }
  .scan-result {
    display: none; margin-top: 10px; padding: 10px 12px;
    background: #0d2b1e; border: 1px solid var(--ok); border-radius: 10px;
    color: var(--ok); font-weight: 600; word-break: break-all;
  }
  /* Form */
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 16px;
    background: var(--card2); color: var(--text);
    border: 1px solid #2a3a58; border-radius: 10px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  /* Brand chip picker */
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 20px; font-size: 14px;
    background: var(--card2); color: var(--text);
    border: 1px solid #2a3a58; cursor: pointer;
  }
  .chip.selected { background: var(--accent); color: #06222f; border-color: var(--accent); font-weight: 700; }
  .brand-custom { display: none; margin-top: 8px; }
  .photo-wrap { margin-top: 12px; }
  .photo-preview { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-top: 8px; }
  .save-btn {
    width: 100%; padding: 16px; margin-top: 16px;
    font-size: 17px; font-weight: 700;
    background: var(--ok); color: #05231a;
    border: none; border-radius: var(--radius); cursor: pointer;
  }
  .save-btn:disabled { opacity: .5; }
  /* Recent + queue */
  .recent-item {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid #22304a; font-size: 14px;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item .meta { color: var(--muted); font-size: 12px; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 20px; align-self: center; white-space: nowrap;
  }
  .badge.sent { background: #0d2b1e; color: var(--ok); }
  .badge.queued { background: #2d2410; color: var(--warn); }
  .queue-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: #2d2410; color: var(--warn);
    padding: 12px 16px; font-size: 14px;
    justify-content: space-between; align-items: center;
    border-top: 1px solid var(--warn);
  }
  .queue-bar button { background: var(--warn); border: none; color: #221a02; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  /* Settings modal */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.6); padding: 20px;
    align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal .card { width: 100%; max-width: 480px; margin: 0; }
  .modal .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .modal .actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal .actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #06222f; }
  .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid #2a3a58 !important; }
  .test-status { margin-top: 10px; font-size: 14px; display: none; }
  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: var(--card2); border: 1px solid #2a3a58; color: var(--text);
    padding: 12px 18px; border-radius: 12px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1><span class="dot" id="netDot"></span> <span data-i18n="headerTitle">Quét Máy Lạnh</span></h1>
  <div class="actions">
    <button class="icon-btn" id="langBtn">EN</button>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </div>
</header>

<main>
  <!-- Scanner -->
  <div class="card">
    <h2 data-i18n="scanCardTitle">Quét tem / mã vạch</h2>
    <div id="reader"></div>
    <button class="scan-btn" id="scanBtn" data-i18n="startScan">📷 Bắt đầu quét</button>
    <div class="scan-result" id="scanResult"></div>
  </div>

  <!-- Details form -->
  <div class="card">
    <h2 data-i18n="detailsCardTitle">Thông tin máy lạnh</h2>
    <label for="serial" data-i18n="serialLabel">Số serial / mã vạch *</label>
    <input id="serial" data-i18n-ph="serialPlaceholder" placeholder="Quét hoặc nhập số serial" autocomplete="off">

    <label data-i18n="brandLabel">Hãng sản xuất</label>
    <div class="chip-grid" id="brandGrid"></div>
    <input id="brandCustom" class="brand-custom" data-i18n-ph="brandCustomPlaceholder" placeholder="Nhập tên hãng khác" autocomplete="off">

    <div class="row">
      <div>
        <label for="model" data-i18n="modelLabel">Model</label>
        <input id="model" data-i18n-ph="modelPlaceholder" placeholder="Mã model" autocomplete="off">
      </div>
      <div>
        <label for="btu" data-i18n="btuLabel">Công suất (BTU)</label>
        <input id="btu" inputmode="numeric" data-i18n-ph="btuPlaceholder" placeholder="VD: 12000" autocomplete="off">
      </div>
    </div>

    <label for="type" data-i18n="typeLabel">Loại máy</label>
    <select id="type"></select>

    <label for="location" data-i18n="locationLabel">Vị trí / công trình</label>
    <input id="location" data-i18n-ph="locationPlaceholder" placeholder="Tòa nhà, tầng, phòng…" autocomplete="off">

    <label for="status" data-i18n="statusLabel">Tình trạng</label>
    <select id="status"></select>

    <label for="notes" data-i18n="notesLabel">Ghi chú</label>
    <textarea id="notes" data-i18n-ph="notesPlaceholder" placeholder="Thông tin thêm…"></textarea>

    <div class="photo-wrap">
      <label for="photo" data-i18n="photoLabel">Ảnh nhãn máy (tùy chọn)</label>
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img class="photo-preview" id="photoPreview" alt="preview">
    </div>

    <button class="save-btn" id="saveBtn" data-i18n="saveBtn">✅ Lưu vào Sheet</button>
  </div>

  <!-- Recent scans -->
  <div class="card">
    <h2 data-i18n="recentCardTitle">Đã quét gần đây (máy này)</h2>
    <div id="recentList"></div>
  </div>
</main>

<!-- Offline queue bar -->
<div class="queue-bar" id="queueBar">
  <span id="queueText"></span>
  <button id="retryBtn" data-i18n="retrySync">Đồng bộ ngay</button>
</div>

<!-- Settings modal -->
<div class="modal" id="settingsModal">
  <div class="card">
    <h2 data-i18n="settingsTitle">Kết nối Google Sheet</h2>
    <label for="webhookUrl" data-i18n="webhookLabel">URL Web App (Apps Script)</label>
    <input id="webhookUrl" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="hint" id="settingsHint"></div>
    <div class="test-status" id="testStatus"></div>
    <div class="actions">
      <button class="btn-ghost" id="testBtn" data-i18n="testBtn">Kiểm tra kết nối</button>
      <button class="btn-primary" id="saveSettingsBtn" data-i18n="saveSettingsBtn">Lưu</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const LS_URL = 'ac_webhook_url';
  const LS_QUEUE = 'ac_queue';
  const LS_RECENT = 'ac_recent';
  const LS_LANG = 'ac_lang';

  /* ---------- i18n ---------- */

  const I18N = {
    vi: {
      headerTitle: 'Quét Máy Lạnh',
      scanCardTitle: 'Quét tem / mã vạch',
      startScan: '📷 Bắt đầu quét',
      stopScan: '✋ Dừng quét',
      startingCamera: '⏳ Đang mở camera…',
      scannedPrefix: '✔ Đã quét: ',
      detailsCardTitle: 'Thông tin máy lạnh',
      serialLabel: 'Số serial / mã vạch *',
      serialPlaceholder: 'Quét hoặc nhập số serial',
      brandLabel: 'Hãng sản xuất',
      brandOther: 'Khác',
      brandCustomPlaceholder: 'Nhập tên hãng khác',
      modelLabel: 'Model',
      modelPlaceholder: 'Mã model',
      typeLabel: 'Loại máy',
      btuLabel: 'Công suất (BTU)',
      btuPlaceholder: 'VD: 12000',
      locationLabel: 'Vị trí / công trình',
      locationPlaceholder: 'Tòa nhà, tầng, phòng…',
      statusLabel: 'Tình trạng',
      notesLabel: 'Ghi chú',
      notesPlaceholder: 'Thông tin thêm…',
      photoLabel: 'Ảnh nhãn máy (tùy chọn)',
      saveBtn: '✅ Lưu vào Sheet',
      saving: '⏳ Đang lưu…',
      recentCardTitle: 'Đã quét gần đây (máy này)',
      noScans: 'Chưa có lượt quét nào.',
      retrySync: 'Đồng bộ ngay',
      settingsTitle: 'Kết nối Google Sheet',
      webhookLabel: 'URL Web App (Apps Script)',
      settingsHint: 'Tạo Google Sheet → Extensions → Apps Script → dán code từ <b>apps-script/Code.gs</b> trong repo này → Deploy → Web app (quyền truy cập: <b>Anyone</b>) → dán URL vào đây. Xem hướng dẫn đầy đủ trong README.',
      testBtn: 'Kiểm tra kết nối',
      saveSettingsBtn: 'Lưu',
      testing: 'Đang kiểm tra…',
      testNoUrl: 'Vui lòng nhập URL trước.',
      testOk: '✅ Đã kết nối! Endpoint hoạt động.',
      testFail: '❌ Không kết nối được. Kiểm tra lại URL và đảm bảo Web App được triển khai với quyền truy cập "Anyone".',
      camError: 'Lỗi camera: ',
      libFail: 'Không tải được thư viện quét (mất mạng?) — bạn vẫn có thể nhập số serial thủ công',
      dupSerial: '⚠️ Số serial này đã được quét trên máy này',
      serialRequired: 'Vui lòng nhập số serial / mã vạch',
      setUrlFirst: 'Hãy thiết lập URL Google Sheet trước (⚙️)',
      savedOk: '✅ Đã lưu vào Google Sheet',
      savedOffline: '📥 Không có mạng — đã lưu tạm trên máy, sẽ đồng bộ sau',
      urlInvalid: 'URL này không giống URL Apps Script',
      urlSaved: '✅ Đã kết nối Sheet',
      urlCleared: 'Đã xoá URL',
      badgeSent: 'đã gửi',
      badgeQueued: 'đang chờ',
      queueSuffix: n => n + ' lượt quét đang chờ đồng bộ',
      syncedToast: n => '🔄 Đã đồng bộ ' + n + ' lượt quét',
    },
    en: {
      headerTitle: 'AC Scanner',
      scanCardTitle: 'Scan label / barcode',
      startScan: '📷 Start scanning',
      stopScan: '✋ Stop scanning',
      startingCamera: '⏳ Starting camera…',
      scannedPrefix: '✔ Scanned: ',
      detailsCardTitle: 'Unit details',
      serialLabel: 'Serial / barcode *',
      serialPlaceholder: 'Scan or type serial number',
      brandLabel: 'Brand',
      brandOther: 'Other',
      brandCustomPlaceholder: 'Type another brand',
      modelLabel: 'Model',
      modelPlaceholder: 'Model number',
      typeLabel: 'Type',
      btuLabel: 'Capacity (BTU)',
      btuPlaceholder: 'e.g. 12000',
      locationLabel: 'Location / site',
      locationPlaceholder: 'Building, floor, room…',
      statusLabel: 'Condition',
      notesLabel: 'Notes',
      notesPlaceholder: 'Anything else…',
      photoLabel: 'Photo of nameplate (optional)',
      saveBtn: '✅ Save to sheet',
      saving: '⏳ Saving…',
      recentCardTitle: 'Recent scans (this device)',
      noScans: 'No scans yet.',
      retrySync: 'Sync now',
      settingsTitle: 'Google Sheet connection',
      webhookLabel: 'Apps Script Web App URL',
      settingsHint: 'Create a Google Sheet → Extensions → Apps Script → paste the code from <b>apps-script/Code.gs</b> in this repo → Deploy → Web app (access: <b>Anyone</b>) → copy the URL here. Full steps are in the README.',
      testBtn: 'Test connection',
      saveSettingsBtn: 'Save',
      testing: 'Testing…',
      testNoUrl: 'Enter a URL first.',
      testOk: '✅ Connected! The endpoint is live.',
      testFail: '❌ Could not reach the endpoint. Check the URL and that the Web App is deployed with access "Anyone".',
      camError: 'Camera error: ',
      libFail: 'Scanner library failed to load (no internet?) — you can still type the serial manually',
      dupSerial: '⚠️ This serial was already scanned on this device',
      serialRequired: 'Serial / barcode is required',
      setUrlFirst: 'Set your Google Sheet URL first (⚙️)',
      savedOk: '✅ Saved to Google Sheet',
      savedOffline: '📥 No connection — saved offline, will sync later',
      urlInvalid: 'That does not look like an Apps Script URL',
      urlSaved: '✅ Sheet connected',
      urlCleared: 'URL cleared',
      badgeSent: 'sent',
      badgeQueued: 'queued',
      queueSuffix: n => n + ' scan' + (n > 1 ? 's' : '') + ' waiting to sync',
      syncedToast: n => '🔄 Synced ' + n + ' queued scan' + (n > 1 ? 's' : ''),
    }
  };

  /* "value" is always the English label — that's what gets written to the
     sheet, so rows stay consistent no matter which language was active on
     the phone that scanned them. */
  const TYPE_OPTIONS = [
    { value: '', vi: '—', en: '—' },
    { value: 'Wall split', vi: 'Treo tường (1 chiều)', en: 'Wall split' },
    { value: 'Multi split', vi: 'Multi (1 dàn nóng, nhiều dàn lạnh)', en: 'Multi split' },
    { value: 'Cassette', vi: 'Âm trần Cassette', en: 'Cassette' },
    { value: 'Ducted / central', vi: 'Nối ống gió / trung tâm', en: 'Ducted / central' },
    { value: 'VRF / VRV', vi: 'VRF / VRV', en: 'VRF / VRV' },
    { value: 'Window', vi: 'Cửa sổ', en: 'Window' },
    { value: 'Portable', vi: 'Di động', en: 'Portable' },
    { value: 'Chiller', vi: 'Chiller', en: 'Chiller' },
  ];

  const STATUS_OPTIONS = [
    { value: '', vi: '—', en: '—' },
    { value: 'Working', vi: 'Đang hoạt động tốt', en: 'Working' },
    { value: 'Needs service', vi: 'Cần bảo trì', en: 'Needs service' },
    { value: 'Needs gas refill', vi: 'Cần nạp gas', en: 'Needs gas refill' },
    { value: 'Broken', vi: 'Hỏng', en: 'Broken' },
    { value: 'For replacement', vi: 'Cần thay mới', en: 'For replacement' },
  ];

  const BRANDS = [
    'Daikin', 'Panasonic', 'Mitsubishi Electric', 'Mitsubishi Heavy', 'LG', 'Samsung',
    'Toshiba', 'Casper', 'Gree', 'Midea', 'Aqua', 'Sharp', 'Electrolux', 'Reetech',
    'Nagakawa', 'Sumikura', 'Funiki', 'Kangaroo', 'Carrier', 'TCL', 'Hitachi',
    'Fujitsu', 'Haier', 'Sanyo'
  ];

  let currentLang = localStorage.getItem(LS_LANG) === 'en' ? 'en' : 'vi';
  function t(key) { return I18N[currentLang][key]; }

  let scanner = null;
  let scanning = false;
  let photoBase64 = '';
  let syncing = false;
  let brandChoice = '';
  let brandIsOther = false;

  /* ---------- helpers ---------- */

  function toast(msg, ms = 2600) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), ms);
  }

  function getUrl() { return (localStorage.getItem(LS_URL) || '').trim(); }
  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
  function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 1200; g.gain.value = 0.15;
      o.start(); o.stop(ctx.currentTime + 0.12);
    } catch {}
    if (navigator.vibrate) navigator.vibrate(80);
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- language ---------- */

  function renderSelectOptions(selectEl, list) {
    const cur = selectEl.value;
    selectEl.innerHTML = list.map(o => `<option value="${esc(o.value)}">${esc(o[currentLang])}</option>`).join('');
    selectEl.value = cur;
  }

  function applyLang() {
    document.documentElement.lang = currentLang;
    $('langBtn').textContent = currentLang === 'vi' ? 'EN' : 'VI';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.placeholder = t(el.getAttribute('data-i18n-ph'));
    });
    $('settingsHint').innerHTML = t('settingsHint');
    $('scanBtn').textContent = scanning ? t('stopScan') : t('startScan');
    renderSelectOptions($('type'), TYPE_OPTIONS);
    renderSelectOptions($('status'), STATUS_OPTIONS);
    renderBrandGrid();
    renderRecent();
    updateQueueBar();
  }

  $('langBtn').addEventListener('click', () => {
    currentLang = currentLang === 'vi' ? 'en' : 'vi';
    localStorage.setItem(LS_LANG, currentLang);
    applyLang();
  });

  /* ---------- network indicator ---------- */

  function updateNet() {
    $('netDot').classList.toggle('online', navigator.onLine);
  }
  window.addEventListener('online', () => { updateNet(); syncQueue(); });
  window.addEventListener('offline', updateNet);
  updateNet();

  /* ---------- brand chip picker ---------- */

  function renderBrandGrid() {
    const html = BRANDS.map(b =>
      `<button type="button" class="chip${brandChoice === b && !brandIsOther ? ' selected' : ''}" data-brand="${esc(b)}">${esc(b)}</button>`
    ).join('') + `<button type="button" class="chip${brandIsOther ? ' selected' : ''}" data-brand="__other__">${esc(t('brandOther'))}</button>`;
    $('brandGrid').innerHTML = html;
  }

  $('brandGrid').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const val = btn.dataset.brand;
    if (val === '__other__') {
      brandIsOther = true;
      brandChoice = '';
      $('brandCustom').style.display = 'block';
      $('brandCustom').focus();
    } else {
      brandIsOther = false;
      brandChoice = val;
      $('brandCustom').style.display = 'none';
      $('brandCustom').value = '';
    }
    renderBrandGrid();
  });

  $('brandCustom').addEventListener('input', () => {
    brandChoice = $('brandCustom').value.trim();
  });

  /* ---------- camera scanning ---------- */

  async function startScan() {
    if (scanning) return stopScan();
    if (typeof Html5Qrcode === 'undefined') {
      toast(t('libFail'), 4500);
      $('serial').focus();
      return;
    }
    scanner = scanner || new Html5Qrcode('reader');
    $('scanBtn').textContent = t('startingCamera');
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 280, height: 160 } },
        onScanSuccess,
        () => {} /* per-frame decode misses are normal */
      );
      scanning = true;
      $('scanBtn').textContent = t('stopScan');
      $('scanBtn').classList.add('stop');
    } catch (err) {
      $('scanBtn').textContent = t('startScan');
      toast(t('camError') + (err && err.message ? err.message : err), 4000);
    }
  }

  async function stopScan() {
    if (scanner && scanning) {
      try { await scanner.stop(); } catch {}
    }
    scanning = false;
    $('scanBtn').textContent = t('startScan');
    $('scanBtn').classList.remove('stop');
  }

  function onScanSuccess(text) {
    beep();
    $('serial').value = text;
    const res = $('scanResult');
    res.textContent = t('scannedPrefix') + text;
    res.style.display = 'block';
    const recent = loadJSON(LS_RECENT);
    if (recent.some(r => r.serial === text)) {
      toast(t('dupSerial'), 3500);
    }
    stopScan();
    $('serial').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('scanBtn').addEventListener('click', startScan);

  /* ---------- photo ---------- */

  $('photo').addEventListener('change', () => {
    const file = $('photo').files[0];
    photoBase64 = '';
    const preview = $('photoPreview');
    if (!file) { preview.style.display = 'none'; return; }
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      photoBase64 = dataUrl.split(',')[1];
      preview.src = dataUrl;
      preview.style.display = 'block';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  });

  /* ---------- save / send ---------- */

  function collectForm() {
    return {
      ts: new Date().toISOString(),
      serial: $('serial').value.trim(),
      brand: brandChoice,
      model: $('model').value.trim(),
      type: $('type').value,
      btu: $('btu').value.trim(),
      location: $('location').value.trim(),
      status: $('status').value,
      notes: $('notes').value.trim(),
      photo: photoBase64
    };
  }

  function resetForm() {
    ['serial','model','btu','location','notes'].forEach(id => $(id).value = '');
    $('type').value = ''; $('status').value = '';
    $('photo').value = ''; photoBase64 = '';
    $('photoPreview').style.display = 'none';
    $('scanResult').style.display = 'none';
    brandChoice = ''; brandIsOther = false;
    $('brandCustom').value = ''; $('brandCustom').style.display = 'none';
    renderBrandGrid();
  }

  async function postScan(entry) {
    const url = getUrl();
    // No custom headers -> "simple" CORS request; Apps Script needs this to work.
    const resp = await fetch(url, { method: 'POST', body: JSON.stringify(entry) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json().catch(() => ({}));
    if (data.ok === false) throw new Error(data.error || 'Sheet rejected the row');
  }

  $('saveBtn').addEventListener('click', async () => {
    const entry = collectForm();
    if (!entry.serial) { toast(t('serialRequired')); $('serial').focus(); return; }
    if (!getUrl()) { toast(t('setUrlFirst')); openSettings(); return; }

    $('saveBtn').disabled = true;
    $('saveBtn').textContent = t('saving');
    let sent = false;
    try {
      await postScan(entry);
      sent = true;
      toast(t('savedOk'));
    } catch (err) {
      const q = loadJSON(LS_QUEUE);
      q.push(entry);
      saveJSON(LS_QUEUE, q);
      toast(t('savedOffline'), 3500);
    }
    addRecent(entry, sent);
    resetForm();
    updateQueueBar();
    $('saveBtn').disabled = false;
    $('saveBtn').textContent = t('saveBtn');
  });

  /* ---------- offline queue ---------- */

  function updateQueueBar() {
    const q = loadJSON(LS_QUEUE);
    const bar = $('queueBar');
    if (q.length) {
      bar.style.display = 'flex';
      $('queueText').textContent = t('queueSuffix')(q.length);
    } else {
      bar.style.display = 'none';
    }
  }

  async function syncQueue() {
    if (syncing || !getUrl()) return;
    let q = loadJSON(LS_QUEUE);
    if (!q.length) return;
    syncing = true;
    let synced = 0;
    while (q.length) {
      try {
        await postScan(q[0]);
        markRecentSent(q[0].ts);
        q.shift();
        saveJSON(LS_QUEUE, q);
        synced++;
      } catch { break; }
    }
    syncing = false;
    updateQueueBar();
    renderRecent();
    if (synced) toast(t('syncedToast')(synced));
  }

  $('retryBtn').addEventListener('click', syncQueue);

  /* ---------- recent list ---------- */

  function addRecent(entry, sent) {
    const recent = loadJSON(LS_RECENT);
    recent.unshift({ ts: entry.ts, serial: entry.serial, brand: entry.brand, model: entry.model, location: entry.location, sent });
    saveJSON(LS_RECENT, recent.slice(0, 30));
    renderRecent();
  }

  function markRecentSent(ts) {
    const recent = loadJSON(LS_RECENT);
    const item = recent.find(r => r.ts === ts);
    if (item) { item.sent = true; saveJSON(LS_RECENT, recent); }
  }

  function renderRecent() {
    const recent = loadJSON(LS_RECENT);
    const el = $('recentList');
    if (!recent.length) {
      el.innerHTML = `<div style="color:var(--muted);font-size:14px">${esc(t('noScans'))}</div>`;
      return;
    }
    el.innerHTML = recent.map(r => `
      <div class="recent-item">
        <div>
          <div><b>${esc(r.serial)}</b> ${esc([r.brand, r.model].filter(Boolean).join(' '))}</div>
          <div class="meta">${esc(r.location || '')} · ${new Date(r.ts).toLocaleString()}</div>
        </div>
        <span class="badge ${r.sent ? 'sent' : 'queued'}">${r.sent ? esc(t('badgeSent')) : esc(t('badgeQueued'))}</span>
      </div>`).join('');
  }

  /* ---------- settings ---------- */

  function openSettings() {
    $('webhookUrl').value = getUrl();
    $('testStatus').style.display = 'none';
    $('settingsModal').classList.add('open');
  }

  $('settingsBtn').addEventListener('click', openSettings);
  $('settingsModal').addEventListener('click', e => {
    if (e.target === $('settingsModal')) $('settingsModal').classList.remove('open');
  });

  $('saveSettingsBtn').addEventListener('click', () => {
    const url = $('webhookUrl').value.trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
      toast(t('urlInvalid'));
      return;
    }
    localStorage.setItem(LS_URL, url);
    $('settingsModal').classList.remove('open');
    toast(url ? t('urlSaved') : t('urlCleared'));
    syncQueue();
  });

  $('testBtn').addEventListener('click', async () => {
    const url = $('webhookUrl').value.trim();
    const st = $('testStatus');
    st.style.display = 'block';
    st.style.color = 'var(--muted)';
    st.textContent = t('testing');
    if (!url) { st.style.color = 'var(--err)'; st.textContent = t('testNoUrl'); return; }
    try {
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.ok) {
        st.style.color = 'var(--ok)';
        st.textContent = t('testOk');
      } else { throw new Error('Unexpected response'); }
    } catch (err) {
      st.style.color = 'var(--err)';
      st.textContent = t('testFail');
    }
  });

  /* ---------- init ---------- */

  applyLang();
  if (!getUrl()) setTimeout(openSettings, 600);
  else syncQueue();
})();
</script>
</body>
</html>
