<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--ARTIFACT-START-->
<title>Anh Sơn Retreat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@1,500&display=swap">
<style>
/* Layout: full-bleed 3D hillside; quiet frosted chips pinned to the four corners, one slim dock at the bottom */
:root{
  --glass:rgba(250,249,244,.84);
  --glass-strong:rgba(250,249,244,.96);
  --ink:#1e2a24;
  --ink-soft:#5c6a62;
  --line:rgba(30,42,36,.1);
  --tea:#2f6b4f;      /* accent: tea-leaf green */
  --amber:#c08a2e;    /* secondary: afternoon light */
  --f-mark:"Lora",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#9fb7a8;color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#ov{pointer-events:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(20,30,25,.06),0 8px 28px rgba(20,30,25,.12);border-radius:999px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
textarea{resize:vertical}

#tl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#mark{padding:8px 16px 8px 14px;display:flex;align-items:baseline;gap:8px}
#mark b{font-family:var(--f-mark);font-style:italic;font-weight:500;font-size:19px;letter-spacing:.1px}
#mark span{font-size:12px;color:var(--ink-soft)}
#mark em{font-style:normal}
#sky{padding:6px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;color:var(--ink)}
#vis{padding:6px 12px;font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
#vis b{font-weight:600}
#sky .t{font-weight:600;font-variant-numeric:tabular-nums}
#sky .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-soft);opacity:.5}
#tr{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
#online{padding:7px 12px;font-size:12.5px;display:flex;gap:7px;align-items:center}
#online i{width:7px;height:7px;border-radius:50%;background:#3fae74;box-shadow:0 0 0 3px rgba(63,174,116,.18)}
#online.off i{background:#a3aca7;box-shadow:none}

#mapwrap{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:18px;padding:5px;line-height:0}
#mini{width:150px;height:150px;border-radius:14px;cursor:pointer;display:block}
#mapwrap small{position:absolute;left:12px;top:9px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.9);line-height:1;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px;align-items:center;max-width:calc(100% - 200px)}
.ic{height:40px;min-width:40px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.ic svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic:hover{background:rgba(30,42,36,.06)}
.ic.on{background:var(--tea);color:#fff}
.vr{width:1px;height:22px;background:var(--line);margin:0 4px}
#chat-form{display:flex;align-items:center;gap:4px}
#chat-input{width:190px;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.65)}

#chatlog{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(184px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px));display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:12.5px}
#chatlog div{background:rgba(250,249,244,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 10px;border-radius:12px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere;line-height:1.4;box-shadow:0 2px 10px rgba(0,0,0,.06)}
#chatlog b{font-weight:600;color:var(--tea)}

#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px));padding:16px 18px 14px;border-radius:20px;display:flex;flex-direction:column;gap:8px}
#card .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft)}
#card h2{margin:0;font-family:var(--f-mark);font-style:italic;font-weight:500;font-size:22px;text-wrap:balance}
#card p{margin:0;color:var(--ink-soft);line-height:1.55}
#card q{display:block;color:var(--ink);font-size:15px;line-height:1.5;quotes:"“" "”"}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.6);font-size:13px;font-weight:500}
.btn:hover{background:#fff}
.btn.pri{background:var(--tea);border-color:var(--tea);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.x{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;color:var(--ink-soft);font-size:18px;line-height:1}
.x:hover{background:rgba(30,42,36,.06)}

#modal{position:fixed;inset:0;background:rgba(20,30,25,.28);display:flex;align-items:center;justify-content:center;padding:16px}
#box{width:min(460px,100%);max-height:min(660px,calc(100% - 32px));overflow:auto;padding:22px;position:relative;border-radius:22px;background:var(--glass-strong)}
#box h2{font-family:var(--f-mark);font-style:italic;font-weight:500;font-size:26px;margin:0 0 4px;text-wrap:balance}
#box .lead{color:var(--ink-soft);margin:0 0 16px;line-height:1.55}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>label,.lab{font-size:11px;color:var(--ink-soft);letter-spacing:.9px;text-transform:uppercase}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.6);font-size:13px}
.seg button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.5}
.row .tx small{color:var(--ink-soft);display:block;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pick{padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.6);text-align:left;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:500}
.pick small{font-weight:400;color:var(--ink-soft);font-size:11.5px}
.pick:hover{background:#fff}
.pick.sel{border-color:var(--tea);box-shadow:inset 0 0 0 1px var(--tea)}
.hours{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.hours div{padding:7px 0;border-radius:10px}
.hours .now{background:rgba(47,107,79,.12);color:var(--tea);font-weight:600}
.hours .e{display:block;font-size:16px;margin-bottom:2px}
.note{font-size:12px;color:var(--ink-soft);line-height:1.55}

#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:9px 16px;font-size:13px;max-width:calc(100% - 32px);text-align:center;border-radius:999px}
#plantbar{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:5px 5px 5px 16px;display:flex;gap:10px;align-items:center;font-size:13px;max-width:calc(100% - 24px)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mark);font-style:italic;font-size:22px;color:#fff;background:#9fb7a8;text-align:center;padding:16px}

@media (max-width:720px){
  #mark span{display:none}
  .ic .lb{display:none}
  .ic{padding:0;width:40px}
  #mini{width:104px;height:104px}
  #dock{left:auto;right:max(12px,env(safe-area-inset-right,0px));transform:none;max-width:calc(100% - 150px);flex-wrap:wrap;justify-content:flex-end;border-radius:22px}
  #chat-input{width:min(150px,40vw)}
  #chatlog{bottom:calc(138px + env(safe-area-inset-bottom,0px))}
  #card{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  #toast,#plantbar{top:calc(104px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="loading">Anh Sơn Retreat</div>
<canvas id="gl" aria-label="Khung cảnh 3D của retreat"></canvas>
<canvas id="ov"></canvas>

<div id="tl">
  <div id="mark" class="glass"><b>Anh Sơn Retreat</b><span>Bảo Lộc · 17.000 m²</span></div>
  <div id="vis" class="glass" hidden title="Tổng lượt ghé retreat"></div>
  <button id="sky" class="glass" title="Thời tiết trong ngày"><span class="t" id="clk">--:--</span><span class="sep"></span><span id="wx">—</span></button>
</div>
<div id="tr"><button id="online" class="glass off" title="Ai đang ở đây"><i></i><span id="online-txt">Đang kết nối</span></button></div>

<div id="chatlog" aria-live="polite"></div>

<div id="mapwrap" class="glass"><canvas id="mini" aria-label="Bản đồ nhỏ, chạm để tới nơi đó"></canvas><small>Bản đồ</small></div>

<div id="dock" class="glass">
  <button class="ic" id="b-plant" title="Trồng cây"><svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/></svg><span class="lb">Trồng cây</span></button>
  <button class="ic" id="b-go" title="Đi tới"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="lb">Đi tới</span></button>
  <button class="ic" id="b-view" title="Toàn cảnh"><svg viewBox="0 0 24 24"><path d="M3 19l6-9 4 5 3-3 5 7z"/><circle cx="17" cy="6" r="2"/></svg><span class="lb">Toàn cảnh</span></button>
  <button class="ic" id="b-book" title="Lưu bút"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span class="lb">Lưu bút</span></button>
  <span class="vr"></span>
  <form id="chat-form" autocomplete="off">
    <input id="chat-input" maxlength="120" placeholder="Nói gì đó…" aria-label="Tin nhắn">
    <button class="ic" type="submit" title="Gửi" aria-label="Gửi"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
  </form>
</div>

<div id="plantbar" class="glass" hidden><span id="plant-txt"></span><button class="btn" id="plant-done">Xong</button></div>
<div id="card" class="glass" hidden></div>
<div id="toast" class="glass" hidden></div>
<div id="modal" hidden><div id="box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById("loading").textContent="Không tải được thư viện 3D. Kiểm tra mạng rồi tải lại trang.";return}
const T=THREE;
/* ================= CONFIG ================= */
const NAME="Anh Sơn Retreat", CAPACITY=200, TZ=7, SPEED=6;
const WAKE=6, SLEEP=23;   // mọi người dậy 6:00, đi ngủ 23:00
// Ranh đất (mét). x: Đông, z: Nam (xuống dốc). Diện tích ≈ 17.000 m². Nhà cao hơn mặt suối ≈ 45 m.
const LAND=[[-39,-84],[84,-84],[95,-76],[26,-58],[50,82],[-75.5,82],[-80,62]];
const ROAD_W=[[-39,-150],[-38,-87.5],[-83.5,62],[-87,92],[-92,180]];   // đường bê tông phía Tây, cầu qua suối cạnh nhà hàng xóm
const ROADS=[ROAD_W];
const DRIVE=[[-39.8,-66.8],[-36,-62.5],[-30,-55.8],[-24,-52],[-16,-51.4],[-8,-51.6],[-8,-53.4]];   // đường sỏi: cổng gỗ → sân cắm trại → cửa chính nhà main
// Đường 2: từ cổng vào uốn lượn chữ U, ít dốc hơn đường 1, vòng qua vườn cá koi rồi vào cổng sân trước
const ROAD2=[[-81.1,54],[-62,49],[-40,42],[-16,35],[6,29],[22,24],[27,14],[25,2],[16,-8],[4,-16],[-6,-26],[-11,-34],[-11,-41]];
const FALLPATH=[[-34,41],[-33,50],[-31,60],[-28,68.5]];                  // từ đường 2 xuống bãi trại và thác
const TRAIL=[[43.5,71.8],[16.8,-56.5]];                                       // đường mòn thẳng từ cuối suối lên hồ bơi
const STREAM=[[-150,60],[-100,63],[-84,66],[-62,68],[-40,72],[-15,71],[10,74],[34,73],[52,75],[75,79],[150,86]];
const SLOPE=.33;
const UP_PAD={x0:-39,x1:31,z0:-82,z1:-69,y:null,f:9};    // tầng trên: nhà mái xanh, nhà làm vườn
const LOW_PAD={x0:-32,x1:31,z0:-68,z1:-56.5,y:null,f:2.2};   // tầng giữa: nhà chính, hồ bơi
const YARD={x0:-28,x1:20,z0:-53.5,z1:-41,y:null,f:3};        // sân trước: thấp hơn hiên một tầng, cắm trại + lửa trại
const TERR={x0:-12.6,x1:-3.4,z0:-57.6,z1:-54.1};             // hiên nằm trên tầng trệt
const GARDEN={x0:-41,x1:-20,z0:-37,z1:-22};   // vườn khách: nhỏ lại 3 m mỗi chiều
const GARDEN_PAD={x0:GARDEN.x0,x1:GARDEN.x1,z0:GARDEN.z0,z1:GARDEN.z1,y:null,f:6};
const TEA={x0:30,x1:92,z0:-83,z1:-62};
const POOL={x0:1.5,x1:15,z0:-65.4,z1:-58};   // 13,5 × 7,4 m, sát cánh nhà vàng/nhà chính, cách tường nhà vàng 2 m
const HUT={x:-50,z:63}, FALL={x:-28,z:71.5}, FIRE={x:-15,z:-47}, NEIGHBOR={x:-98,z:48}, NETH={x:-21,z:-61}, BOARD={x:-33.5,z:-63.4,ry:-.3};
const PARK={x0:-36,x1:-22,z0:-72.2,z1:-68.6,y:null,f:2.5};      // bãi đậu xe cạnh nhà blue (xe đỗ song song)
const ROSE={x0:-22.2,x1:-11.2,z0:-81.5,z1:-75,y:null,f:3};      // vườn hồng nhỏ, bên kia nhà mái xanh (xa cổng gỗ)
const KOI={x:5,z:12.5,rx:5,rz:3.2};                              // hồ cá koi giữa vườn, trong lòng chữ U của đường 2
const KOIPAD={x0:-5,x1:15,z0:5,z1:20,y:null,f:5};
const CAMP2={x0:-43,x1:-31,z0:52.5,z1:62,y:null,f:3.5}, CAMP2_FIRE=[-36,60.5];   // bãi trại giữa đường 2 và thác
const CAMPS=[YARD,CAMP2];
const PADS=[UP_PAD,LOW_PAD,YARD,PARK,ROSE,KOIPAD,CAMP2,GARDEN_PAD,{x0:HUT.x-4,x1:HUT.x+4,z0:HUT.z-4,z1:HUT.z+4,y:null,f:4},{x0:NEIGHBOR.x-8,x1:NEIGHBOR.x+8,z0:NEIGHBOR.z-6,z1:NEIGHBOR.z+6,y:null,f:5}];
const BLOCKS=[
  {x0:-34.4,x1:-23.6,z0:-78.5,z1:-72.5},  // nhà blue: 2 căn, sát bãi đậu xe
  {x0:-12.5,x1:-3.5,z0:-64.5,z1:-57.5},  // nhà chính – mái xám
  {x0:-25.2,x1:-16.8,z0:-64.7,z1:-64.3}, // nhà lưới: tường Bắc
  {x0:-25.2,x1:-24.8,z0:-64.5,z1:-57.3}, // tường Tây
  {x0:-17.2,x1:-16.8,z0:-64.5,z1:-57.3}, // tường Đông
  {x0:-25.2,x1:-22.3,z0:-57.7,z1:-57.3}, // tường Nam, bên trái cửa
  {x0:-19.7,x1:-16.8,z0:-57.7,z1:-57.3}, // tường Nam, bên phải cửa (cửa rộng 2,6 m ở giữa)
  {x0:-38.4,x1:-35.6,z0:-80.3,z1:-77.7},   // bồn nước: bên phải nhà blue, phía cổng gỗ
  {x0:BOARD.x-1.5,x1:BOARD.x+1.5,z0:BOARD.z-1.5,z1:BOARD.z+1.5}, // bảng lưu bút
  {x0:-12.9,x1:-9.3,z0:-54.2,z1:-53.4},  // mặt tiền tầng trệt (chừa lối cửa chính)
  {x0:-6.7,x1:-3.1,z0:-54.2,z1:-53.4},
  {x0:-13.3,x1:-12.6,z0:-57,z1:-53.4},   // lan can hiên phía Tây
  {x0:-3.4,x1:-2.9,z0:-55.6,z1:-53.4},   // lan can hiên phía Đông
  {x0:NEIGHBOR.x-6,x1:NEIGHBOR.x+6,z0:NEIGHBOR.z-4,z1:NEIGHBOR.z+4}, // nhà hàng xóm
];
const $=id=>document.getElementById(id);

/* ================= UTILS ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>t*t*(3-2*t);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
let toastT=0;function toast(m,ms=2800){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}

function wxAt(t){
  const mo=new Date(t*3600e3).getUTCMonth()+1,h=((t%24)+24)%24,wet=mo>=5&&mo<=11;
  const aft=Math.exp(-(((h-15)/2.6)**2));

  const rain=clamp((cloud-.58)/.32,0,1)*gate*(wet?1:.45);

  const fogMorning=Math.exp(-(((h-6.3)/1.7)**2))*(vnoise(15,t,24)>.35?.95:.45);
  const fogNight=(h>21||h<4)?.3*vnoise(16,t,5):0;

  for(const s of segs){if(tt<pause)return{x:s.a[0],z:s.a[1],moving:false,dir:Math.atan2(s.b[0]-s.a[0],s.b[1]-s.a[1])};tt-=pause;if(tt<s.d){const k=tt/s.d;return{x:lerp(s.a[0],s.b[0],k),z:lerp(s.a[1],s.b[1],k),moving:true,dir:Math.atan2(s.b[0]-s.a[0],s.b[1]-s.a[1])}}tt-=s.d}

}

    if(i)cum+=Math.hypot(x-pts[i-1][0],z-pts[i-1][1]);
    const yc=opts&&opts.flatY?opts.flatY(x,z):null;
    for(const s of[-1,1]){const px=x+nx*w/2*s,pz=z+nz*w/2*s;pos.push(px,(yc!=null?yc:(opts&&opts.yfn?opts.yfn(px,pz):H(px,pz)))+off,pz);uv.push(s<0?0:1,cum/((opts&&opts.uvLen)||8))}
    if(i){const k=i*2;idx.push(k-2,k-1,k,k-1,k+1,k)}}
  const g=new T.BufferGeometry();g.setAttribute("position",new T.Float32BufferAttribute(pos,3));if(opts&&opts.uv)g.setAttribute("uv",new T.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new T.Mesh(g,new T.MeshLambertMaterial(Object.assign({color,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2},opts&&opts.mat||{})));m.receiveShadow=true;return m;
}

const fill=(s,m)=>s.replace(/\{(\w)\}/g,(_,k)=>m[k]!=null?m[k]:"");
function pandaCan(x,z){return !blocked(x,z)&&!inPool(x,z)&&!(((x-KOI.x)/(KOI.rx+.6))**2+((z-KOI.z)/(KOI.rz+.6))**2<1)}
function pandaMove(tx,tz,spd,dt){const P=PANDA,dx=tx-P.x,dz=tz-P.z,d=Math.hypot(dx,dz);if(d<.4){P.mv=0;return true}
  const st=Math.min(d,spd*dt),ux=dx/d,uz=dz/d;let nx=P.x+ux*st,nz=P.z+uz*st,ok=true;
  if(!pandaCan(nx,nz)){if(pandaCan(nx,P.z))nz=P.z;else if(pandaCan(P.x,nz))nx=P.x;else ok=false}
  const mv=ok?Math.hypot(nx-P.x,nz-P.z):0;if(ok){P.x=nx;P.z=nz}P.mv=mv/Math.max(dt,1e-3);P.stuck=mv<st*.3?P.stuck+dt:0;
  const ang=Math.atan2(ux,uz);let da=ang-P.dir;da=Math.atan2(Math.sin(da),Math.cos(da));P.dir+=da*Math.min(1,dt*6);return false}
function pandaTargetPos(t){try{return t.pos()}catch(e){return null}}
function pandaCandidates(){const P=PANDA,c=[];
  for(const s of STAFF.concat(GUESTS)){const st=s._st;if(st&&!st.away)c.push({id:s.id,name:s.name,k:"npc",pos:()=>[s._st.x,s._st.z]})}
  for(const p of PETS){if(p.panda||petAsleep(p)||p._x==null)continue;c.push({id:p.id,name:p.name,k:"pet",kind:p.kind,pos:()=>[p._x,p._z]})}
  for(const [rk,r] of remotes.entries()){if(isFinite(r.x)&&isFinite(r.z))c.push({id:"r:"+rk,name:String((r.p&&r.p.n)||"Khách").slice(0,24),k:"rp",pos:()=>[r.x,r.z]})}
  if(me.joined){const m={id:"me",name:me.n,k:"me",pos:()=>[me.x,me.z]};c.push(m,m)}
  return c.filter(t=>{const q=t.pos();return q&&Math.hypot(q[0]-P.x,q[1]-P.z)<55&&pandaCan(q[0],q[1])})}
function pandaChase(t){const P=PANDA,now=Date.now();P.target=t;P.mode="chase";P.until=now+9000;P.run=1;P.stuck=0;
  say(PANDA_P.id,fill(pick(CH_START),{T:t.name}));
  setTimeout(()=>{if(P.target!==t)return;if(t.k==="npc"||t.k==="rp")say(t.id,pick(CH_RUN_NPC));else if(t.k==="pet")say(t.id,pick(CH_RUN_PET[t.kind]||CH_RUN_PET["chó"]));else toast(pick(CH_RUN_ME),4200)},900)}
function pandaStartChase(){const P=PANDA,c=pandaCandidates();if(!c.length){P.nextChase=Date.now()+20000;return false}pandaChase(pick(c));return true}
function pandaPickWalk(){const P=PANDA;const c=POIS.filter(q=>pandaCan(q[0],q[1])&&Math.hypot(q[0]-P.x,q[1]-P.z)>6&&Math.hypot(q[0]-P.x,q[1]-P.z)<70);const q=c.length?pick(c):P.home;P.tx=q[0];P.tz=q[1];P.mode="wander";P.until=Date.now()+45000;P.run=0;P.stuck=0}
function stepPanda(dt,time){const P=PANDA,pp=PANDA_P,now=Date.now(),asleep=petAsleep(pp);if(!pandaCan(P.x,P.z)){P.bad=(P.bad||0)+dt;if(P.bad>2){P.x=P.home[0];P.z=P.home[1];P.bad=0}}else P.bad=0;P.mv=0;
  if(asleep){P.mode="sleep";P.run=0;pandaMove(P.home[0],P.home[1],2,dt)}
  else{if(P.mode==="sleep"){P.mode="idle";P.until=now+3000}
    if(P.mode==="idle"){if(now>P.until){if(!(now>P.nextChase&&pandaStartChase()))pandaPickWalk()}}
    else if(P.mode==="wander"){if(pandaMove(P.tx,P.tz,1.5,dt)){P.mode="idle";P.until=now+(4+Math.random()*6)*1000;if(Math.random()<.5)say(pp.id,pick(PANDA_IDLE))}else if(now>P.until||P.stuck>1.2){P.mode="idle";P.until=now+800;P.stuck=0}}
    else if(P.mode==="chase"){const q=pandaTargetPos(P.target);if(!q||now>P.until||P.stuck>1.4){P.mode="idle";P.until=now+3500;P.run=0;P.nextChase=now+(35+Math.random()*45)*1000;P.target=null;say(pp.id,"*thở hổn hển* Hết giờ, gấu cần ăn tre.")}
      else if(Math.hypot(q[0]-P.x,q[1]-P.z)<1.7){const t=P.target;P.mode="catch";P.until=now+2600;P.run=0;P.nextChase=now+(40+Math.random()*50)*1000;doFx("heart",P.x,P.z);say(pp.id,fill(pick(CH_CATCH),{T:t.name}));
        setTimeout(()=>{if(t.k==="npc"||t.k==="rp")say(t.id,pick(CH_CAUGHT_NPC));else if(t.k==="pet")say(t.id,pick(CH_CAUGHT_PET[t.kind]||CH_CAUGHT_PET["chó"]));else toast(pick(CH_CAUGHT_ME),4500)},900)}
      else pandaMove(q[0],q[1],3.6,dt)}
    else if(P.mode==="catch"){if(now>P.until){P.mode="idle";P.until=now+(6+Math.random()*4)*1000;P.target=null}}}
  const u=pp.obj.userData;if(u.legs){const mv=P.mv>.2,k=mv?Math.sin(time*(P.run?11:7))*(P.run?.75:.45):0;u.legs[0].rotation.x=k;u.legs[3].rotation.x=k;u.legs[1].rotation.x=-k;u.legs[2].rotation.x=-k;
    if(u.head)u.head.rotation.x=asleep?.55:mv?0:Math.sin(time*6)*.16+.12}}

function keyMove(dt){let f=0,s=0;if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.a||keys.arrowleft)s-=1;if(keys.d||keys.arrowright)s+=1;
  if((!f&&!s)||!me.joined)return false;
  // hướng tới = từ camera nhìn vào nhân vật
  const fwx=-Math.sin(camS.yaw),fwz=-Math.cos(camS.yaw),rtx=-fwz,rtz=fwx;
  const dx=fwx*f+rtx*s*-1,dz=fwz*f+rtz*s*-1,l=Math.hypot(dx,dz)||1;me.tx=null;me.after=null;stepTowards(me.x+dx/l*5,me.z+dz/l*5,dt);return true}
const _v=new T.Vector3();
function project(x,y,z){_v.set(x,y,z).project(camera);if(_v.z>1)return null;return{x:(_v.x+1)/2*CW,y:(1-_v.y)/2*CH}}
function tap(px,py){
  let best=null,bd=34;const cand=(x,y,z,o)=>{const s=project(x,y,z);if(!s)return;const d=Math.hypot(s.x-px,s.y-py);if(d<bd){bd=d;best=o}};
  for(const s of STAFF){const st=s._st;if(st&&!st.away)cand(st.x,groundY(st.x,st.z)+1.2,st.z,{t:"npc",o:s})}
  for(const g of GUESTS){const st=g._st;if(st)cand(st.x,groundY(st.x,st.z)+1.2,st.z,{t:"npc",o:g})}
  for(const p of PETS)if(p._x!=null)cand(p._x,p.obj.position.y+.4,p._z,{t:"pet",o:p});
  for(const b of GBIRDS)if(b.o.visible)cand(b._x,b._y+.25,b._z,{t:"bird",o:b});
  if(owl.o.visible)cand(owl.o.position.x,owl.o.position.y,owl.o.position.z,{t:"bird",o:owl});
  for(const r of remotes.values())cand(r.x,groundY(r.x,r.z)+1.2,r.z,{t:"guest",o:r});
  for(const L of lanterns)cand(L.m.position.x,L.m.position.y,L.m.position.z,{t:"lantern",o:L.l});
  if(!plantMode)for(const p of Store.data.plants)if(isFinite(p.x))cand(p.x,H(p.x,p.z)+.5,p.z,{t:"plant",o:p});
  if(best){showEntity(best);return}
  ndc.set(px/CW*2-1,-(py/CH)*2+1);ray.setFromCamera(ndc,camera);const hit=ray.intersectObject(terrain)[0];
  if(!hit)return;
  const x=hit.point.x,z=hit.point.z;
  if(!me.joined){openJoin();return}
  if(plantMode){if(!inRect(x,z,GARDEN)){toast("Chỉ trồng được trong vườn của khách (ô có hàng rào gỗ)");return}tryPlant(x,z);return}
  const spot=SPOTS.find(s=>s.hit(x,z));
  if(spot){showSpot(spot);walkTo(spot.at?spot.at[0]:x,spot.at?spot.at[1]:z);return}
  if(!walkable(x,z)){toast("Ngoài ranh đất của retreat");return}
  if(streamDist(x,z)<3.2&&!fordNear(x,z)&&!onRoad(x,z))toast("Suối khá sâu. Chỗ nông đi bộ qua được nằm cách cầu 6 m, có sỏi.");
  closeCard();walkTo(x,z);
}
function walkTo(x,z,after){if(!me.joined){openJoin();return}if(camS.mode==="drone")setView(false);
  if(blocked(x,z)){const a=Math.atan2(me.z-z,me.x-x);for(let r=.5;r<25;r+=.5){const nx=x+Math.cos(a)*r,nz=z+Math.sin(a)*r;if(!blocked(nx,nz)){x=nx;z=nz;break}}}
  me.tx=x;me.tz=z;me.after=after||null}
function walkAlong(pts){let i=0;const step=()=>{if(i>=pts.length)return;const p=pts[i++];walkTo(p[0],p[1],step)};step()}
function teleport(x,z,yaw){if(yaw!=null){camS.yaw=yaw;camS.pitch=.38;camS.dist=15}if(!me.joined){camS.tx=x;camS.tz=z;return}me.x=x;me.z=z;me.tx=null;me.after=null;camTarget.set(x,groundY(x,z)+1.6,z);pushPresence()}
function stepTowards(tx,tz,dt){const dx=tx-me.x,dz=tz-me.z,d=Math.hypot(dx,dz);const slow=inPool(me.x,me.z)?.45:streamDist(me.x,me.z)<2.4?.5:1;const sp=SPEED*slow*dt;
  if(d<1e-3)return true;me.r=Math.atan2(dx,dz);if(d<=sp){if(!blocked(tx,tz)){me.x=tx;me.z=tz}return true}
  const nx=me.x+dx/d*sp,nz=me.z+dz/d*sp;if(!blocked(nx,nz)){me.x=nx;me.z=nz}else if(!blocked(nx,me.z))me.x=nx;else if(!blocked(me.x,nz))me.z=nz;else return true;return false}
let moving=false;
function unstick(){if(!blocked(me.x,me.z))return;for(let r=.6;r<30;r+=.6)for(let k=0;k<16;k++){const a=k/16*6.283,x=me.x+Math.cos(a)*r,z=me.z+Math.sin(a)*r;if(!blocked(x,z)){me.x=x;me.z=z;me.tx=null;me.after=null;return}}}

function walkPet(p,f){const tx=p._x+.9,tz=p._z+.5;if(inRect(p._x,p._z,AVI)&&!inRect(me.x,me.z,AVI)){walkTo(NETH.x,NETH.z+4.6,()=>walkTo(NETH.x,NETH.z+2.4,()=>walkTo(clamp(tx,-24.3,-17.7),clamp(tz,-63.9,-58.3),f)))}else walkTo(tx,tz,f)}
function stepMe(dt){if(!me.joined)return;unstick();moving=false;
  if(keyMove(dt))moving=true;

  if(moving)maybePush()}

function petActs(p,asleep){if(asleep)return[];const near=f=>()=>walkPet(p,f),following=petFollow&&petFollow.id===p.id&&petFollow.until>Date.now();

      petFollow={id:p.id,until:Date.now()+180000};pushPresence();doFx("paw",p._x,p._z);say(p.id,pick(PET_SOUNDS[p.kind]));toast(`${p.name} sẽ đi theo bạn 3 phút. Đi đâu cũng được, miễn có đồ ăn.`,4000)})]];
  const ahead=(d)=>{let tx=me.x+Math.sin(me.r)*d,tz=me.z+Math.cos(me.r)*d;if(!walkable(tx,tz)||blocked(tx,tz)){tx=me.x+1;tz=me.z+1}return[tx,tz]};

  c.fillStyle="rgba(255,255,255,.85)";c.font=`600 ${9*od}px "Be Vietnam Pro",sans-serif`;c.textAlign="right";c.textBaseline="top";c.fillText("B ↑",W-6*od,6*od)}
$("mini").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();const x=MM.x0+(e.clientX-r.left)/r.width*(MM.x1-MM.x0),z=MM.z0+(e.clientY-r.top)/r.height*(MM.z1-MM.z0);
  if(!walkable(x,z)){toast("Ngoài ranh đất");return}let tx=x,tz=z;if(blocked(tx,tz)){for(let k=1;k<20;k++){if(!blocked(tx+k,tz)){tx+=k;break}if(!blocked(tx,tz+k)){tz+=k;break}}}setView(false);teleport(tx,tz)});

/* ================= LOOP ================= */
let last=performance.now(),acc=0,chatterT=10,envT=0,petT=6;
function frame(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;acc+=dt;envT-=dt;
  if(acc>1){acc=0;tick();updateHud();const sl=Math.floor(TOD/2);if(sl!==guestSlot){guestSlot=sl;GUESTS.forEach(g=>{const o=npcObjs.get(g.id);if(o){scene.remove(o);npcObjs.delete(g.id)}});GUESTS=guestsNow()}}
  if(envT<=0){envT=2;updateEnv()}
  stepMe(dt);
  const time=t/1000;
  for(const s of STAFF.concat(GUESTS)){const st=npcState(s);s._st=st;const o=npcObj(s);o.visible=!st.away;if(st.away)continue;o.position.set(st.x,groundY(st.x,st.z),st.z);o.rotation.y=st.dir;animPerson(o,st.moving,time,false)}
  stepPanda(dt,time);stepDoor(dt);YH.top.visible=!(me.joined&&inRect(me.x,me.z,YH));
  for(const p of PETS){const q=petPos(p);if(p._x==null){p._x=q.x;p._z=q.z}const pk=1-Math.pow(q.run?.0001:.004,dt);p._x=lerp(p._x,q.x,pk);p._z=lerp(p._z,q.z,pk);
    const py=inPool(p._x,p._z)?LOW_PAD.y+.05:groundY(p._x,p._z);p.obj.position.set(p._x,py,p._z);p.obj.rotation.y=q.dir;const sl=petAsleep(p);p.obj.scale.y=sl?.75:1;if(p.obj.userData.tail)p.obj.userData.tail.rotation.y=sl?0:Math.sin(time*(p.kind==="chó"||q.follow?12:3))*.5;
    if((q.run||q.follow)&&p.kind!=="thỏ")p.obj.position.y+=Math.abs(Math.sin(time*14))*.06;
    if(p.kind==="thỏ"&&!sl)p.obj.position.y+=Math.abs(Math.sin(time*5+hash(p.id)))*.15}
  updateBirds(time,dt);if(me.tent)syncTent("me",me.tent,me.c);
  for(const r of remotes.values()){const p=r.p||{};const tx=+p.x,tz=+p.z;if(isFinite(tx)&&isFinite(tz)){const k=1-Math.pow(.001,dt);const mv=Math.hypot(tx-r.x,tz-r.z)>.05;r.x=lerp(r.x,tx,k);r.z=lerp(r.z,tz,k);r.obj.position.set(r.x,groundY(r.x,r.z),r.z);if(isFinite(+p.r))r.obj.rotation.y=+p.r;animPerson(r.obj,mv,time,p.a==="swim")}}
  if(me.joined&&me.obj){me.obj.position.set(me.x,groundY(me.x,me.z),me.z);me.obj.rotation.y=me.r;animPerson(me.obj,moving,time,me.a==="swim")}
  for(const L of lanterns){const n=streamInLand.length,u=((time*.004+L.off)%1)*(n-1),i=Math.floor(u),f=u-i,a=streamInLand[i],b=streamInLand[Math.min(n-1,i+1)];const x=lerp(a[0],b[0],f),z=lerp(a[1],b[1],f),y=waterY(x,z)+.2+Math.sin(time*2+L.off*9)*.04;L.m.position.set(x,y,z);L.m.rotation.y=time*.3+L.off*6;L.sp.position.set(x,y+.2,z)}
  fallFoam.forEach(f=>{f.m.position.y=f.y0+Math.abs(Math.sin(time*3+f.ph))*.5;f.m.material.opacity=.4+.3*Math.sin(time*4+f.ph)});
  if(fallTex)fallTex.offset.y+=dt*1.5;
  waterTex.offset.y-=dt*.45;
  RIPPLES.forEach(q=>{const f=(time*.45+q.ph)%1;q.m.scale.setScalar(.6+f*2.4);q.m.material.opacity=.55*(1-f)});
  fallMist.forEach(f=>{const k=.9+.25*Math.sin(time*1.3+f.ph);f.m.scale.setScalar(k);f.m.position.y=f.y0+Math.sin(time*.8+f.ph)*.25;f.m.material.opacity=.09+.05*Math.sin(time*1.7+f.ph)});
  {const feeding=koiFeed&&time-koiFeed.t<7,kk=1-Math.pow(.03,dt);KOIFISH.forEach(f=>{let tx,tz;if(feeding){tx=koiFeed.x+Math.sin(time*3+f.ph)*.6;tz=koiFeed.z+Math.cos(time*2.6+f.ph)*.4}else{const a=time*f.sp+f.ph;tx=KOI.x+Math.cos(a)*KOI.rx*.8*f.rr;tz=KOI.z+Math.sin(a*1.3)*KOI.rz*.75*f.rr}
    const ex=(tx-KOI.x)/(KOI.rx*.88),ez=(tz-KOI.z)/(KOI.rz*.88),q=Math.hypot(ex,ez);if(q>1){tx=KOI.x+(tx-KOI.x)/q;tz=KOI.z+(tz-KOI.z)/q}
    const ox=f.g.position.x,oz=f.g.position.z;f.g.position.x=lerp(ox,tx,kk);f.g.position.z=lerp(oz,tz,kk);const mx=f.g.position.x-ox,mz=f.g.position.z-oz;if(Math.hypot(mx,mz)>1e-5)f.g.rotation.y=Math.atan2(mx,mz);f.tail.rotation.y=Math.sin(time*9+f.ph)*.5})}
  if(flame.visible){flame.scale.set(1+Math.sin(time*13)*.12,1+Math.sin(time*9)*.2,1+Math.cos(time*11)*.12);fire.intensity=1.4+Math.sin(time*17)*.25}
  if(rain.visible){const cnt=Math.floor(RAIN_N*clamp(WX.rain*1.4,0,1)),cp=camera.position;for(let i=0;i<RAIN_N;i++){const o=i*6;if(i>=cnt){rainPos[o]=rainPos[o+1]=rainPos[o+2]=rainPos[o+3]=rainPos[o+4]=rainPos[o+5]=0;continue}const d=rainSeed[i];d.y-=d.v*dt;if(d.y<0)d.y=40;const x=cp.x+d.x,z=cp.z+d.z,y=cp.y-14+d.y;rainPos[o]=x;rainPos[o+1]=y;rainPos[o+2]=z;rainPos[o+3]=x+.15;rainPos[o+4]=y+.9;rainPos[o+5]=z}rainGeo.attributes.position.needsUpdate=true}
  clouds.forEach((c,i)=>{c.position.x+=dt*(2+i%3);if(c.position.x>900)c.position.x=-900});
  petT-=dt;if(petT<=0){petT=9+Math.random()*10;if(me.joined){const n=PETS.filter(p=>!petAsleep(p)&&Math.hypot(p._x-me.x,p._z-me.z)<5);if(n.length){const p=pick(n);say(p.id,pick(PET_SOUNDS[p.kind]))}}}
  if(petFollow&&petFollow.until<=Date.now()){const p=PETS.find(q=>q.id===petFollow.id);petFollow=null;pushPresence();if(p)toast(`${p.name} hết giờ đi dạo, chạy về chỗ cũ.`)}
  chatterT-=dt;if(chatterT<=0){chatterT=16+Math.random()*18;const near=STAFF.concat(GUESTS).filter(s=>s._st&&!s._st.away&&Math.hypot(s._st.x-camTarget.x,s._st.z-camTarget.z)<45);if(near.length){const s=pick(near);say(s.id,npcLine(s))}}
  banterT-=dt;if(banterT<=0){banterT=11+Math.random()*13;try{runBanter()}catch(e){console.warn(e)}}
  watchNewcomers();
  updateCamera(dt);
  renderer.render(scene,camera);
  octx.clearRect(0,0,CW,CH);
  const cp=camera.position;
  for(const s of STAFF.concat(GUESTS)){const st=s._st;if(!st||st.away)continue;drawLabel(st.x,groundY(st.x,st.z)+2.35,st.z,s.name,s.plan?"staff":"",bubbleOf(s.id),Math.hypot(st.x-cp.x,st.z-cp.z))}
  for(const [rk,r] of remotes.entries()){const p=r.p||{};const b=(p.s&&Date.now()-r.sayAt<8000?String(p.s).slice(0,120):"")||bubbleOf("r:"+rk);drawLabel(r.x,groundY(r.x,r.z)+2.35,r.z,String(p.n||"Khách").slice(0,24),"",b,Math.hypot(r.x-cp.x,r.z-cp.z))}
  for(const p of PETS){const d=Math.hypot(p._x-cp.x,p._z-cp.z),bb=bubbleOf(p.id);if(d<25||bb)drawLabel(p._x,p.obj.position.y+(p.panda?2.6:1.05),p._z,d<25?p.name+(petAsleep(p)?" · zzz":petLeader(p)?" · đi theo":""):"","",bb,d*1.6)}
  for(const b of GBIRDS.concat([owl])){if(!b.o.visible)continue;const pp=b.o.position,d=Math.hypot(pp.x-cp.x,pp.z-cp.z),bb=bubbleOf(b.id);if(d<14||bb)drawLabel(pp.x,pp.y+.75,pp.z,d<14?b.name:"","",bb,d*2)}
  if(me.joined)drawLabel(me.x,groundY(me.x,me.z)+2.35,me.z,me.n,"me",bubbleOf("me"),0);
  if(me.tx!=null){const s=project(me.tx,groundY(me.tx,me.tz)+.05,me.tz);if(s){octx.strokeStyle="rgba(255,255,255,.9)";octx.lineWidth=2;octx.beginPath();octx.ellipse(s.x,s.y,10+3*Math.sin(t/150),5+1.5*Math.sin(t/150),0,0,7);octx.stroke()}}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.y+=f.vy*dt;if(f.t>f.life){fx.splice(i,1);continue}const s=project(f.x,f.y,f.z);if(!s)continue;octx.globalAlpha=1-f.t/f.life;octx.font='20px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';octx.textAlign="center";octx.textBaseline="middle";octx.fillText(f.e,s.x,s.y);octx.globalAlpha=1}
  drawMini();
  requestAnimationFrame(frame);
}

/* ================= BOOT ================= */
const hot=window.claude&&window.claude.hot;
function start(data){
  resize();updateHud();updateEnv();
  if(data&&data.me&&data.me.joined){Object.assign(me,data.me);me.obj=makePerson({shirt:me.c,hat:me.hat});scene.add(me.obj)}
  camTarget.set(me.x,groundY(me.x,me.z)+1.6,me.z);
  $("loading").hidden=true;requestAnimationFrame(frame);
  Store.init();initRoom().then(()=>{if(me.joined)pushPresence()});
  if(!me.joined){setView(true);openJoin()}
  if(hot&&hot.snapshot)hot.snapshot(()=>({me:{joined:me.joined,n:me.n,c:me.c,hat:me.hat,x:me.x,z:me.z,r:me.r}}));
}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
