<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--ARTIFACT-START-->
<title>An Viên Resort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pangolin&display=swap">
<style>
/* Layout: full-screen living map, HUD floats on the edges like signboards in a garden */
:root{
  --ink:#f3efe2;          /* text on panels */
  --ink-dim:#b9c4b4;
  --panel:rgba(20,44,36,.86);   /* lacquered jade */
  --panel-solid:#16302a;
  --line:rgba(243,239,226,.16);
  --jade:#5fbf8f;         /* accent */
  --gold:#e8b84a;         /* secondary accent */
  --danger:#e07a5f;
  --ground:#6f9e58;
  --f-display:"Pangolin","Comic Sans MS",cursive;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:rgba(243,239,226,.08);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(243,239,226,.16)}
.btn.primary{background:var(--jade);color:#0f2a20;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--gold);color:#2a1f05;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{resize:vertical}

#hud-top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#hud-top>*{pointer-events:auto}
#brand{padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
#brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.1;letter-spacing:.3px}
#brand .sub{color:var(--ink-dim);font-size:12px}
#clock{padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
#clock .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#clock .wx{font-size:24px;line-height:1}
#clock .meta{display:flex;flex-direction:column;font-size:12px;color:var(--ink-dim)}
#online{padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
#online .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 6px var(--jade)}
#online.off .dot{background:var(--ink-dim);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

#hud-bottom{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;pointer-events:none}
#hud-bottom>*{pointer-events:auto}
#bar{padding:8px;display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
#chat-form{display:flex;gap:6px;flex:1 1 200px;min-width:0}
#chat-input{flex:1;min-width:0}
#mini{width:132px;height:132px;border-radius:12px;display:block;flex:none;cursor:crosshair}

#chatlog{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 24px));max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px}
#chatlog div{background:rgba(10,25,20,.55);padding:3px 8px;border-radius:8px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
#chatlog b{color:var(--gold);font-weight:600}

#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));padding:14px 16px;display:flex;flex-direction:column;gap:8px}
#card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px}
#card p{margin:0;color:var(--ink-dim);line-height:1.5}
#card .acts{display:flex;gap:6px;flex-wrap:wrap}
.x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:20px;color:var(--ink-dim);padding:4px 8px}

#modal{position:fixed;inset:0;background:rgba(5,15,10,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .panel{width:min(520px,100%);max-height:min(640px,calc(100% - 32px));overflow:auto;padding:18px;position:relative;background:var(--panel-solid)}
#modal h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 6px}
#modal .lead{color:var(--ink-dim);margin:0 0 12px;line-height:1.5}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:rgba(243,239,226,.05)}
.row .em{font-size:22px;line-height:1;flex:none;width:28px;text-align:center}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.45}
.row .tx small{color:var(--ink-dim);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.pick{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(243,239,226,.05);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.pick .em{font-size:26px}
.pick.sel{border-color:var(--gold);background:rgba(232,184,74,.18)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--ink-dim);letter-spacing:.4px;text-transform:uppercase}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.sel{border-color:var(--ink)}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:12px}
.hours div{padding:6px 2px;border-radius:8px;background:rgba(243,239,226,.05);font-variant-numeric:tabular-nums}
.hours .now{outline:1px solid var(--gold)}
.hours .e{font-size:18px;display:block}
.note{font-size:12px;color:var(--ink-dim);line-height:1.5}

#toast{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
#plantbar{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:13px;max-width:calc(100% - 24px)}

@media (max-width:640px){
  #brand h1{font-size:18px}
  #brand .sub{display:none}
  #clock .meta{display:none}
  #mini{width:96px;height:96px}
  .bt-label{display:none}
  #chatlog{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  #card{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="world" aria-label="Bản đồ resort"></canvas>

<div id="hud-top">
  <div id="brand" class="panel">
    <h1 id="rname">An Viên Resort</h1>
    <span class="sub">17.000 m² · nhà vườn mở cửa cho mọi người ghé chơi</span>
  </div>
  <div class="stack">
    <div id="clock" class="panel" role="button" tabindex="0" title="Xem dự báo theo giờ">
      <span class="wx" id="wx-ico">☀️</span>
      <span class="big" id="clk">--:--</span>
      <span class="meta"><span id="wx-txt">—</span><span id="date-txt">—</span></span>
    </div>
    <div id="online" class="panel off" role="button" tabindex="0" title="Ai đang ở resort">
      <span class="dot"></span><span id="online-txt">Đang kết nối…</span>
    </div>
  </div>
</div>

<div id="chatlog" aria-live="polite"></div>

<div id="hud-bottom">
  <div id="bar" class="panel">
    <button class="btn" id="b-plant" title="Trồng cây ở vườn cộng đồng">🌱<span class="bt-label">Trồng cây</span></button>
    <button class="btn" id="b-go" title="Đi tới khu vực">🧭<span class="bt-label">Đi tới</span></button>
    <button class="btn" id="b-book" title="Sổ lưu bút">📖<span class="bt-label">Lưu bút</span></button>
    <button class="btn" id="b-me" title="Về chỗ tôi">📍</button>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="120" placeholder="Nói gì đó với mọi người…" aria-label="Tin nhắn">
      <button class="btn primary" type="submit">Gửi</button>
    </form>
  </div>
  <canvas id="mini" class="panel" aria-label="Bản đồ nhỏ, chạm để đi tới"></canvas>
</div>

<div id="plantbar" class="panel" hidden>
  <span id="plant-txt">Chạm vào vườn cộng đồng để trồng</span>
  <button class="btn" id="plant-cancel">Xong</button>
</div>
<div id="card" class="panel" hidden></div>
<div id="toast" class="panel" hidden></div>
<div id="modal" hidden><div class="panel" id="modal-box"></div></div>

<script>
(function(){
"use strict";
/* ============ CONFIG ============ */
const RESORT_NAME = "An Viên Resort";
const CAPACITY = 200;
const W = 130, H = 130;           // mét — 16.900 m²
const TZ_OFFSET = 7;              // giờ Việt Nam
const SPEED = 5.5;                // m/s đi bộ
document.getElementById("rname").textContent = RESORT_NAME;

/* ============ UTILS ============ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function vnNow(){const d=new Date(Date.now()+TZ_OFFSET*3600e3);return{y:d.getUTCFullYear(),mo:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),s:d.getUTCSeconds(),wd:d.getUTCDay()}}
const WD=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return"vừa xong";if(m<60)return m+" phút trước";const h=Math.round(m/60);if(h<24)return h+" giờ trước";return Math.round(h/24)+" ngày trước"}
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
let toastT=0;function toast(msg,ms=2600){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}

/* ============ MAP ============ */
// Khu vực (mét). Gốc toạ độ góc trên-trái, phía Bắc ở trên, cổng ở phía Nam.
const ZONES = [
  {id:"gate",   name:"Cổng chính",          x:58,y:120,w:14,h:10, go:[65,126], ico:"⛩️"},
  {id:"house",  name:"Nhà chính",           x:48,y:38,w:34,h:20, go:[65,61], ico:"🏡"},
  {id:"pool",   name:"Hồ bơi",              x:86,y:40,w:22,h:16, go:[96,59], ico:"🏊"},
  {id:"bung",   name:"Bungalow nghỉ",       x:50,y:8,w:48,h:16, go:[73,28], ico:"🛖"},
  {id:"orch",   name:"Vườn cây ăn trái",    x:6,y:6,w:36,h:22, go:[24,30], ico:"🥭"},
  {id:"pets",   name:"Khu thú cưng",        x:102,y:6,w:22,h:22, go:[112,30], ico:"🐇"},
  {id:"lawn",   name:"Bãi cỏ BBQ & võng",   x:8,y:38,w:32,h:32, go:[24,72], ico:"🔥"},
  {id:"pond",   name:"Hồ sen",              x:9,y:86,w:30,h:20, go:[30,108], ico:"🪷"},
  {id:"tea",    name:"Chòi trà",            x:39,y:101,w:7,h:7, go:[42,110], ico:"🍵"},
  {id:"garden", name:"Vườn cộng đồng",      x:84,y:84,w:38,h:26, go:[103,81], ico:"🌱"},
  {id:"staff",  name:"Nhà nhân viên",       x:6,y:114,w:14,h:10, go:[24,119], ico:"🏠"},
  {id:"park",   name:"Bãi đỗ xe",           x:80,y:116,w:22,h:11, go:[90,114], ico:"🚗"},
  {id:"flower", name:"Vườn hoa",            x:44,y:114,w:12,h:12, go:[50,112], ico:"🌺"},
];
const Z = Object.fromEntries(ZONES.map(z=>[z.id,z]));
const POND = {cx:24,cy:96,rx:15,ry:10};
const FOUNTAIN = {x:65,y:68,r:3};
const SOLIDS = [
  {x:48,y:38,w:34,h:20},               // nhà chính
  {x:54,y:12,w:9,h:9},{x:69,y:12,w:9,h:9},{x:84,y:12,w:9,h:9}, // bungalow
  {x:6,y:114,w:14,h:10},               // nhà nhân viên
  {x:104,y:8,w:4,h:3},                 // chuồng chó
];
const PATHS = [
  [[65,130],[65,71]], [[65,65],[65,58]],
  [[8,78],[124,78]], [[8,32],[124,32]],
  [[44,32],[44,112]], [[116,32],[116,112]],
  [[65,32],[65,38]], [[58,24],[58,32]],[[73,24],[73,32]],[[88,24],[88,32]],
  [[82,50],[86,50]], [[44,112],[65,112]], [[65,112],[100,112]],
  [[20,112],[44,112]], [[42,108],[42,112]],
];
const LAMPS = [];
for(let y=76;y<=128;y+=10){LAMPS.push([62.5,y],[67.5,y])}
for(let x=12;x<=122;x+=14){LAMPS.push([x,80.5])}
for(let x=12;x<=122;x+=16){LAMPS.push([x,34.5])}
LAMPS.push([84,40],[110,40],[84,56],[110,56],[42,100],[46,108],[22,60],[30,60]);

// cây trang trí: hàng rào cây quanh ranh đất + vườn cây ăn trái
const DECOR=[];
(function(){const r=rng(42);
  for(let x=2;x<W;x+=4){if(x<57||x>73)DECOR.push({x,y:128.2+r()*.6,r:1.8+r()*.8,c:0});DECOR.push({x,y:1.8+r()*.6,r:1.8+r()*.8,c:0})}
  for(let y=6;y<H-4;y+=4){DECOR.push({x:1.8+r()*.6,y,r:1.8+r()*.8,c:0});DECOR.push({x:128.2+r()*.6,y,r:1.8+r()*.8,c:0})}
  const fruitCols=["#f2c94c","#e8743b","#c0392b","#8bc34a"];
  for(let gx=0;gx<6;gx++)for(let gy=0;gy<4;gy++)DECOR.push({x:10+gx*6+r(),y:9+gy*5.3+r(),r:2.1+r()*.5,c:1,f:fruitCols[(gx+gy)%4]});
  // bóng mát quanh bãi cỏ
  [[11,46],[19,44],[37,48],[36,64],[10,66]].forEach(p=>DECOR.push({x:p[0],y:p[1],r:2.6,c:2}));
  // dừa dọc hồ bơi
  for(let x=88;x<=108;x+=5)DECOR.push({x,y:37.5,r:1.6,c:3});
  // rải rác
  for(let i=0;i<26;i++){const x=6+r()*118,y=6+r()*118;if(okDecor(x,y))DECOR.push({x,y,r:1.6+r()*1.2,c:2})}
  function okDecor(x,y){for(const z of ZONES)if(x>z.x-3&&x<z.x+z.w+3&&y>z.y-3&&y<z.y+z.h+3)return false;
    for(const p of PATHS){const[a,b]=p;const minx=Math.min(a[0],b[0])-3,maxx=Math.max(a[0],b[0])+3,miny=Math.min(a[1],b[1])-3,maxy=Math.max(a[1],b[1])+3;if(x>minx&&x<maxx&&y>miny&&y<maxy)return false}
    return true}
})();

function inEllipse(x,y,e,pad=0){const dx=(x-e.cx)/(e.rx+pad),dy=(y-e.cy)/(e.ry+pad);return dx*dx+dy*dy<1}
function blocked(x,y){
  if(x<3||y<3||x>W-3||y>H-1)return true;
  if(y>H-3&&(x<60||x>70))return true;
  for(const s of SOLIDS)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;
  if(inEllipse(x,y,POND))return true;
  if(Math.hypot(x-FOUNTAIN.x,y-FOUNTAIN.y)<FOUNTAIN.r)return true;
  return false;
}
const inRect=(x,y,z)=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h;
const inPool=(x,y)=>x>87&&x<107&&y>41&&y<55;
function inGarden(x,y){const g=Z.garden;return x>g.x+1&&x<g.x+g.w-1&&y>g.y+1&&y<g.y+g.h-1}
function zoneAt(x,y){for(const z of ZONES)if(inRect(x,y,z))return z;return null}

/* ============ TIME & WEATHER ============ */
function dayWeather(y,mo,d){
  const r=rng(hash(`wx-${y}-${mo}-${d}`));
  const rainySeason = mo>=5&&mo<=11;
  const roll=r();
  let type;
  if(rainySeason) type = roll<.15?"storm":roll<.62?"shower":roll<.82?"cloudy":"sunny";
  else type = roll<.05?"shower":roll<.40?"cloudy":"sunny";
  const tmin = (rainySeason?24.5:23)+r()*2, tmax = (rainySeason?31:32)+r()*3 - (type==="storm"?2:0);
  const rs = 13+r()*4, rd = type==="storm"?1.5+r()*1.5:.6+r()*1.8;
  const morningDrizzle = type!=="sunny" && r()<.25 ? 6+r()*3 : -1;
  const cloudBase = type==="sunny"?.12:type==="cloudy"?.55:.4;
  return {type,tmin,tmax,rs,rd,morningDrizzle,cloudBase,seed:r()};
}
function hourWx(dw,h){ // h dạng số thực 0..24
  let rain=0;
  if(dw.type==="shower"||dw.type==="storm"){const t=(h-dw.rs)/dw.rd;if(t>=0&&t<=1)rain=(dw.type==="storm"?1:.6)*Math.sin(Math.PI*t)**.6}
  if(dw.morningDrizzle>0&&h>=dw.morningDrizzle&&h<dw.morningDrizzle+.7)rain=Math.max(rain,.25);
  let cloud=dw.cloudBase+.15*Math.sin(h*.9+dw.seed*6);
  if(dw.type!=="sunny"){const pre=(h-(dw.rs-1.5));if(pre>0&&pre<dw.rd+2.5)cloud+=.35}
  cloud=clamp(cloud+rain*.5,0,1);
  const k=Math.cos((h-14.5)/24*2*Math.PI)*.5+.5;
  const temp=dw.tmin+(dw.tmax-dw.tmin)*k - rain*3;
  const storm = dw.type==="storm"&&rain>.5;
  return {rain,cloud,temp,storm};
}
function wxIcon(w,h){const night=h<5.8||h>18.3;if(w.storm)return"⛈️";if(w.rain>.45)return"🌧️";if(w.rain>.05)return"🌦️";if(w.cloud>.65)return"☁️";if(w.cloud>.35)return night?"☁️":"⛅";return night?"🌙":(w.cloud>.2?"🌤️":"☀️")}
function wxText(w){if(w.storm)return"Mưa dông";if(w.rain>.45)return"Mưa to";if(w.rain>.05)return"Mưa rào";if(w.cloud>.65)return"Nhiều mây";if(w.cloud>.35)return"Có mây";return"Nắng đẹp"}
function darkness(h){ // 0 ngày → 1 đêm
  if(h>=6.5&&h<=17.5)return 0;

  if(h<6.5)return 1-(h-5)/1.5;

}

function routeLoop(pts,t,speed=1.1,pause=18){
  const segs=[];let total=0;
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const len=Math.hypot(b[0]-a[0],b[1]-a[1]);const d=len/speed;segs.push({a,b,d});total+=d+pause}
  let tt=((t%total)+total)%total;
  for(const s of segs){if(tt<pause)return{x:s.a[0],y:s.a[1],moving:false};tt-=pause;if(tt<s.d){const k=tt/s.d;return{x:lerp(s.a[0],s.b[0],k),y:lerp(s.a[1],s.b[1],k),moving:true}}tt-=s.d}
  return{x:pts[0][0],y:pts[0][1],moving:false};
}

function petAsleep(p){return p.sleep.some(([a,b])=>a<b?(TOD>=a&&TOD<b):(TOD>=a||TOD<b))}
function petPos(p){
  const ph=hash(p.id)%1000/159;
  const t=(petAsleep(p)?Math.floor(Date.now()/600000)*600:Date.now()/1000)*p.spd*.02;
  const a=p.area;
  let x=a.cx+a.rx*(.7*Math.sin(t*1.3+ph)+.3*Math.sin(t*3.1+ph*2));
  let y=a.cy+a.ry*(.7*Math.cos(t*1.1+ph*1.7)+.3*Math.sin(t*2.3+ph));
  if(blocked(x,y)){x=a.cx;y=a.cy+a.ry*.9}
  return{x,y};
}

const Store={mode:"local",db:null,subs:{},data:{plants:[],lanterns:[],guestbook:[]},
  canWrite:true,
  async init(){
    let db=null;
    try{ if(window.claude&&claude.use) db=await claude.use("db") }catch(e){db=null}
    if(db){this.mode="db";this.db=db;
      for(const col of Object.keys(this.data)){
        let timer=setTimeout(()=>toast("Dữ liệu vườn tải chậm, vẫn đang thử…"),10000);
        db.collection(col).orderBy("at","desc").limit(col==="plants"?500:120).onSnapshot(snap=>{
          clearTimeout(timer);
          this.data[col]=snap.docs.map(d=>({id:d.id,...d.data()}));this.emit(col);
        },err=>{clearTimeout(timer);console.warn(col,err)});
      }
    }else{
      for(const col of Object.keys(this.data))this.data[col]=ls.get("resort-"+col,[]);
      for(const col of Object.keys(this.data))this.emit(col);
    }
  },
  on(col,fn){(this.subs[col]=this.subs[col]||[]).push(fn)},
  emit(col){(this.subs[col]||[]).forEach(f=>f(this.data[col]))},
  async add(col,doc){
    doc.at=Date.now();
    if(this.mode==="db"){await this.db.collection(col).add(doc);return}
    doc.id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    this.data[col].unshift(doc);ls.set("resort-"+col,this.data[col]);this.emit(col);
  },
  async update(col,id,patch){
    if(this.mode==="db"){await this.db.collection(col).doc(id).update(patch);return}
    const d=this.data[col].find(x=>x.id===id);if(d)Object.assign(d,patch);ls.set("resort-"+col,this.data[col]);this.emit(col);
  },
  async remove(col,id){
    if(this.mode==="db"){await this.db.collection(col).doc(id).delete();return}
    this.data[col]=this.data[col].filter(x=>x.id!==id);ls.set("resort-"+col,this.data[col]);this.emit(col);
  }
};

async function initRoom(){
  try{ if(window.claude&&claude.use) room=await claude.use("room") }catch(e){room=null}
  try{ if(window.claude&&claude.use) user=await claude.use("user") }catch(e){user=null}
  try{ isOwner=!!(user&&user.isOwner&&user.isOwner()) }catch(e){}
  if(!room){
    $("online").classList.add("off");
    $("online-txt").textContent="Đang chơi một mình";
    $("online").title="Mở trang trên claude.ai để gặp mọi người";
    return;
  }
  roomOK=true;
  room.onPeers(ch=>{
    for(const p of ch.left)remotes.delete(p.peer);
    for(const p of ch.peers){
      if(p.isMe)continue;
      const pr=p.presence||{};
      if(!pr.j){remotes.delete(p.peer);continue}
      let r=remotes.get(p.peer);
      if(!r){r={dx:+pr.x||65,dy:+pr.y||126,lastSt:pr.st,lastFx:pr.fx&&pr.fx.t};remotes.set(p.peer,r)}
      r.p=pr;r.guest=p.guest;
      if(pr.st&&pr.st!==r.lastSt&&pr.s){r.lastSt=pr.st;logChat(String(pr.n||"Khách"),String(pr.s))}
      if(pr.fx&&pr.fx.t!==r.lastFx){r.lastFx=pr.fx.t;spawnFx(pr.fx.k,+pr.fx.x,+pr.fx.y)}
    }
    onlineCount=remotes.size+(me.joined?1:0);
    updateOnline();
  });
  if(room.onConnection)room.onConnection(c=>{$("online").classList.toggle("off",!c)});
}
function updateOnline(){
  if(!roomOK)return;
  $("online").classList.remove("off");
  $("online-txt").textContent=`${onlineCount}/${CAPACITY} khách đang ở resort`;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function rectW(x,y,w,h,fill,rad=0){ctx.fillStyle=fill;rr(sx(x),sy(y),w*S,h*S,rad*S);ctx.fill()}
function emoji(e,x,y,size){ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(e,sx(x),sy(y))}
function label(t,x,y,size=12,bg="rgba(15,35,28,.72)",fg="#f3efe2"){
  ctx.font=`600 ${size}px "Be Vietnam Pro",system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  const w=ctx.measureText(t).width+10,X=sx(x),Y=sy(y);ctx.fillStyle=bg;rr(X-w/2,Y-size*.8,w,size*1.6,size*.8);ctx.fill();ctx.fillStyle=fg;ctx.fillText(t,X,Y+.5)}
function visible(x,y,m=6){return sx(x)>-m*S&&sx(x)<CW+m*S&&sy(y)>-m*S&&sy(y)<CH+m*S}

function drawTree(t){
  if(!visible(t.x,t.y,4))return;
  const X=sx(t.x),Y=sy(t.y),R=t.r*S;
  ctx.fillStyle="rgba(20,40,15,.22)";ctx.beginPath();ctx.ellipse(X+R*.25,Y+R*.3,R,R*.8,0,0,7);ctx.fill();
  if(t.c===3){ // dừa
    ctx.strokeStyle="#2e7d32";ctx.lineWidth=Math.max(2,S*.35);ctx.lineCap="round";
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2+.3;ctx.beginPath();ctx.moveTo(X,Y);ctx.quadraticCurveTo(X+Math.cos(a)*R*.7,Y+Math.sin(a)*R*.5,X+Math.cos(a)*R*1.25,Y+Math.sin(a)*R*1.1);ctx.stroke()}
    ctx.fillStyle="#8d6e3a";ctx.beginPath();ctx.arc(X,Y,S*.35,0,7);ctx.fill();return}
  const base=t.c===0?"#3f7a3a":t.c===1?"#4b8a3c":"#4f9447";
  ctx.fillStyle=base;ctx.beginPath();ctx.arc(X,Y,R,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.12)";ctx.beginPath();ctx.arc(X-R*.3,Y-R*.3,R*.55,0,7);ctx.fill();
  if(t.f){ctx.fillStyle=t.f;for(let i=0;i<5;i++){const a=i*1.3+t.x;ctx.beginPath();ctx.arc(X+Math.cos(a)*R*.55,Y+Math.sin(a)*R*.55,Math.max(1.5,S*.22),0,7);ctx.fill()}}
}

function drawPond(){

  const r=rng(11);

function stepMe(dt){
  if(!me.joined||me.tx==null)return;
  const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);
  const sp=(inPool(me.x,me.y)?SPEED*.45:SPEED)*dt;
  if(d<=sp){me.x=me.tx;me.y=me.ty;me.tx=me.ty=null;arrived();maybePush();return}
  const nx=me.x+dx/d*sp,ny=me.y+dy/d*sp;
  if(!blocked(nx,ny)){me.x=nx;me.y=ny}
  else if(!blocked(nx,me.y)){me.x=nx}
  else if(!blocked(me.x,ny)){me.y=ny}
  else{me.tx=me.ty=null;me.after=null;toast("Đường bị chắn, thử đi vòng nhé")}
  const sw=inPool(me.x,me.y);if(sw&&me.a!=="swim")me.a="swim";else if(!sw&&me.a==="swim")me.a="";
  if(me.a&&me.a!=="swim"&&d>1.5)me.a="";
  maybePush();
}
function arrived(){const f=me.after;me.after=null;if(f)f()}
function walkTo(x,y,after){
  if(!me.joined){openJoin();return}
  // nếu điểm đích nằm trong vật cản: dừng ở gần nhất
  let tx=x,ty=y;if(blocked(tx,ty)){const ang=Math.atan2(me.y-y,me.x-x);for(let r=.5;r<20;r+=.5){const a=x+Math.cos(ang)*r,b=y+Math.sin(ang)*r;if(!blocked(a,b)){tx=a;ty=b;break}}}
  me.tx=tx;me.ty=ty;me.after=after||null;cam.follow=true;
}

cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];S=clamp(pinch.S*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,6,40);userZoom=true;return}

function tap(px,py){
  const x=wx(px),y=wy(py),hitR=Math.max(1.3,22/S);
  if(plantMode){if(!inGarden(x,y)){toast("Chỉ trồng được trong vườn cộng đồng (ô viền vàng)");return}tryPlant(x,y);return}
  // thực thể
  let best=null,bd=hitR;
  const cand=(d,o)=>{if(d<bd){bd=d;best=o}};
  for(const p of PETS)if(p._x!=null)cand(Math.hypot(p._x-x,p._y-y),{t:"pet",o:p});
  for(const s of STAFF)if(s._st&&!s._st.away)cand(Math.hypot(s._st.x-x,s._st.y-y),{t:"staff",o:s});
  for(const [id,r] of remotes)cand(Math.hypot(r.dx-x,r.dy-y),{t:"guest",o:r});
  for(const l of Store.data.lanterns)if(l._x!=null&&Date.now()-(l.at||0)<48*3600e3)cand(Math.hypot(l._x-x,l._y-y),{t:"lantern",o:l});
  for(const p of Store.data.plants)if(isFinite(p.x))cand(Math.hypot(p.x-x,p.y-y)*1.2,{t:"plant",o:p});
  if(best){showEntity(best);return}
  const spot=HOTSPOTS.find(h=>h.hit(x,y));
  if(spot){showSpot(spot);walkTo(spot.at[0],spot.at[1]);return}
  closeCard();walkTo(x,y);
}

  SHIRTS.forEach(c=>sw.append(el("button",{type:"button",class:"sw"+(c===me.c?" sel":""),style:`background:${c}`,"aria-label":"Màu áo "+c,onclick:ev=>{me.c=c;sw.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));ev.currentTarget.classList.add("sel")}})));
  const go=el("button",{class:"btn primary",type:"submit"},"Vào resort");if(full)go.disabled=true;
  const f=el("form",null,el("div",{class:"fld"},el("label",{for:"join-name"},"Tên của bạn"),nm),el("div",{class:"fld"},el("label",null,"Hình đại diện"),av),el("div",{class:"fld"},el("label",null,"Màu áo"),sw),
    el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},go,el("button",{class:"btn",type:"button",onclick:()=>{closeModal();toast("Đang ngắm cảnh. Chạm bất kỳ đâu để vào resort.")}},"Chỉ ngắm cảnh")));
  f.addEventListener("submit",e=>{e.preventDefault();const n=nm.value.trim().replace(/\s+/g," ");if(!n){nm.focus();toast("Nhập tên để mọi người biết bạn là ai");return}
    if(roomOK&&remotes.size>=CAPACITY){toast(`Resort đang đủ ${CAPACITY} khách`);return}
    me.n=n.slice(0,24);ls.set("resort-me",{n:me.n,e:me.e,c:me.c});
    if(!me.joined){me.joined=true;me.x=63+Math.random()*4;me.y=126;cam.x=me.x;cam.y=me.y-6;}
    closeModal();pushPresence();onlineCount=remotes.size+1;updateOnline();
    me.s=`Xin chào, mình là ${me.n} 👋`;me.st=Date.now();pushPresence();logChat(me.n,me.s);
    toast("Chạm vào bản đồ để đi lại. Chạm vào người, thú cưng, hồ… để làm hoạt động.",4500)});
  box.append(f);
  if(!roomOK)box.append(el("p",{class:"note",style:"margin-top:12px"},"Bạn đang mở bản chạy riêng nên chỉ thấy chính mình. Cây trồng và lưu bút được lưu trên trình duyệt này."));
  setTimeout(()=>nm.focus(),60);
}

/* ---- chat ---- */
function logChat(n,s){const L=$("chatlog");L.append(el("div",null,el("b",null,n.slice(0,24)+": "),s.slice(0,120)));while(L.children.length>8)L.firstChild.remove();L.scrollTop=L.scrollHeight;
  const last=L.lastChild;setTimeout(()=>{if(last.parentNode)last.remove()},30000)}
$("chat-form").addEventListener("submit",e=>{e.preventDefault();const i=$("chat-input"),t=i.value.trim();if(!t)return;if(!me.joined){openJoin();return}
  me.s=t.slice(0,120);me.st=Date.now();pushPresence();logChat(me.n,me.s);i.value="";i.blur()});

/* ---- buttons ---- */
$("b-plant").onclick=()=>{if(plantMode)setPlantMode(false);else openPlantPicker()};
$("plant-cancel").onclick=()=>setPlantMode(false);
$("b-me").onclick=()=>{if(!me.joined){openJoin();return}cam.follow=true};
$("b-book").onclick=openBook;
$("b-go").onclick=()=>{const box=modal("🧭 Đi tới","Chọn nơi muốn tới, bạn sẽ tự đi bộ tới đó.");const g=el("div",{class:"grid"});
  ZONES.forEach(z=>g.append(el("button",{class:"pick",onclick:()=>{closeModal();if(me.joined){walkTo(z.go[0],z.go[1]);const s=HOTSPOTS.find(h=>h.hit(z.x+z.w/2,z.y+z.h/2));if(s)showSpot(s)}else{cam.x=z.go[0];cam.y=z.go[1];cam.follow=false}}},el("span",{class:"em"},z.ico),z.name)));box.append(g)};
function openPeople(){
  const box=modal("👥 Ai đang ở resort",roomOK?`${onlineCount}/${CAPACITY} khách đang online.`:"Bạn đang chơi một mình (bản chạy riêng).");
  const L=el("div",{class:"list"});
  STAFF.forEach(s=>{const st=staffState(s);L.append(el("div",{class:"row"},el("span",{class:"em"},s.emoji),el("div",{class:"tx"},`${s.name} — ${s.role}`,el("small",null,st.verb))))});
  PETS.forEach(p=>L.append(el("div",{class:"row"},el("span",{class:"em"},p.emoji),el("div",{class:"tx"},`${p.name} (${p.kind})`,el("small",null,petAsleep(p)?"đang ngủ":"đang chơi ở "+(zoneAt(p._x||0,p._y||0)?.name||"sân vườn"))))));
  if(me.joined)L.append(el("div",{class:"row"},el("span",{class:"em"},me.e),el("div",{class:"tx"},me.n+" (bạn)",el("small",null,zoneAt(me.x,me.y)?.name||"đang dạo"))));
  for(const r of remotes.values()){const p=r.p||{};L.append(el("div",{class:"row"},el("span",{class:"em"},String(p.e||"🧑").slice(0,8)),el("div",{class:"tx"},String(p.n||"Khách").slice(0,24),el("small",null,zoneAt(r.dx,r.dy)?.name||"đang dạo"))))}
  box.append(L);
}
$("online").onclick=openPeople;$("online").onkeydown=e=>{if(e.key==="Enter")openPeople()};
function openForecast(){
  const box=modal(`${wxIcon(WX,TOD)} Thời tiết hôm nay`,`${WD[NOW.wd]}, ${NOW.d}/${NOW.mo}/${NOW.y} · ${Math.round(DW.tmin)}–${Math.round(DW.tmax)}°C · ${NOW.mo>=5&&NOW.mo<=11?"mùa mưa":"mùa khô"}. Thời tiết đổi mỗi ngày và giống nhau với mọi người ghé thăm.`);
  const g=el("div",{class:"hours"});
  for(let h=0;h<24;h++){const w=hourWx(DW,h+.5);g.append(el("div",{class:h===NOW.h?"now":""},el("span",{class:"e"},wxIcon(w,h+.5)),`${h}h`,el("br"),`${Math.round(w.temp)}°`))}
  box.append(g);
  box.append(el("p",{class:"note",style:"margin-top:12px"},"Lịch trong ngày: 6:00 cho thú cưng ăn · 8:00 vớt lá hồ bơi · 11:30 cơm trưa · 14:00 trà chiều ở chòi · 18:00 đốt lò BBQ · 22:00 resort lên đèn ngủ."));
}
$("clock").onclick=openForecast;$("clock").onkeydown=e=>{if(e.key==="Enter")openForecast()};

function updateHud(){
  $("clk").textContent=`${String(NOW.h).padStart(2,"0")}:${String(NOW.mi).padStart(2,"0")}`;
  $("wx-ico").textContent=wxIcon(WX,TOD);
  $("wx-txt").textContent=`${wxText(WX)} · ${Math.round(WX.temp)}°C`;
  $("date-txt").textContent=`${WD[NOW.wd]}, ${NOW.d}/${NOW.mo}`;
}

/* ============ BOOT ============ */
function start(data){
  resize();updateHud();
  if(data&&data.me&&data.me.joined){Object.assign(me,data.me);cam.x=me.x;cam.y=me.y}
  requestAnimationFrame(frame);
  Store.init();
  initRoom().then(()=>{if(me.joined)pushPresence()});
  if(!me.joined)openJoin();
  if(hot&&hot.snapshot)hot.snapshot(()=>({me:{joined:me.joined,n:me.n,e:me.e,c:me.c,x:me.x,y:me.y}}));
}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
<!--ARTIFACT-END-->
